<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Dadmo Pad">
<title>Dadmo Pad</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/pad.css?v=1795508480">
</head>
<body>
<div class="rotate" id="rotate">TURN YOUR PHONE SIDEWAYS<small>WON'T TURN? SWIPE DOWN FROM THE TOP-RIGHT CORNER AND TAP THE LOCK ICON</small></div>

<div class="pad" id="pad">
  <header class="bar">
    <span id="who">JOINING…</span>
    <span class="bar-mid"><span class="pill" data-k="start" id="pauseBtn">❚❚ PAUSE</span><span class="pill leave" id="leaveBtn">LEAVE</span></span>
    <span id="status">CONNECTING</span>
  </header>

  <div class="left-ctrl">
  <div class="stick" id="stick" hidden aria-label="Joystick"><div class="stick-ring"></div><div class="knob" id="knob"></div><small class="stick-label">MOVE</small></div>
  <div class="dpad" id="dpad" aria-label="Direction pad">
    <div class="d up" data-k="up">▲<small id="lup"></small></div>
    <div class="d left" data-k="left">◀<small id="lleft"></small></div>
    <div class="d mid"></div>
    <div class="d right" data-k="right">▶<small id="lright"></small></div>
    <div class="d down" data-k="down">▼<small id="ldown"></small></div>
  </div>
  </div>

  <div class="logo-mid" id="logoMid">DADMO<br>BOWL</div>
  <div class="pick" id="pick" hidden aria-live="polite"></div>

  <div class="right-ctrl">
  <div class="boost" data-k="b" id="boostBtn" hidden>BOOST</div>
  <div class="buttons">
    <div class="b-wrap"><div class="b" data-k="x">X</div><span class="b-label" id="lx">START</span></div>
    <div class="b-wrap"><div class="b" data-k="z">Z</div><span class="b-label" id="lz">START</span></div>
  </div>
  </div>
</div>

<div class="sheet" id="sheet" hidden>
  <p id="sheetMsg"></p>
  <textarea id="sheetCode" rows="4" autocapitalize="off" autocomplete="off" autocorrect="off" spellcheck="false" aria-label="Backup code"></textarea>
  <p id="sheetNote" class="sheet-note"></p>
  <div class="sheet-btns"><button id="sheetGo" type="button"></button><button id="sheetClose" type="button" class="ghost">CLOSE</button></div>
</div>

<div class="join-form" id="joinForm" hidden>
  <p id="joinMsg">ENTER THE ROOM CODE ON THE TV</p>
  <input id="codeIn" maxlength="4" autocapitalize="characters" autocomplete="off" spellcheck="false" aria-label="Room code">
  <button id="codeGo" type="button">JOIN</button>
</div>

<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="js/holiday.js?v=1795508480"></script>
<script src="js/net.js?v=1795508480"></script>
<script src="js/pad.js?v=1795508480"></script>
</body>
</html>
